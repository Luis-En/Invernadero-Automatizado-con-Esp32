; ESP8266 gateway bring-up node: ESP-NOW receiver -> USB serial to the PC.
;
; It forwards telemetry from the ESP8266 field node to the Raspberry Pi (or a
; PC running the serial bridge) using the same JSON+CRC line protocol as the
; ESP32 gateway, so no backend changes are needed.
;
; Build:  pio run -e gateway
; Upload: pio run -e gateway -t upload
; Monitor: pio device monitor   (115200)

[platformio]
default_envs = gateway

[env]
monitor_speed = 115200
monitor_filters = time
build_flags =
    -std=gnu++17
    -Iinclude
lib_deps =
    bblanchon/ArduinoJson@^6.21.3
    symlink://../../common

[env:gateway]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
build_unflags = -std=gnu++11
upload_speed = 921600
monitor_filters = esp8266_exception_decoder, time

; ESP8266 field bring-up node: one soil moisture sensor on A0.
;
; It pairs with the esp8266_gateway board over ESP-NOW. Use it to verify the
; soil probe, the ESP-NOW link and the whole pipeline to the PC, one component
; at a time.
;
; Build:  pio run -e field
; Upload: pio run -e field -t upload
; Monitor: pio device monitor

[platformio]
default_envs = field

[env]
monitor_speed = 115200
monitor_filters = time
build_flags =
    -std=gnu++17
    -Iinclude
lib_deps =
    bblanchon/ArduinoJson@^6.21.3
    symlink://../../common

[env:field]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
build_unflags = -std=gnu++11
upload_speed = 921600
monitor_filters = esp8266_exception_decoder, time

; ESP32 / ESP8266 Gateway: ESP-NOW <-> USB Serial bridge.
;
; Build:   pio run -e gateway               (ESP32)
;          pio run -e gateway_esp8266       (ESP8266)
; Upload:  pio run -e <env> -t upload
; Monitor: pio device monitor
;
; The *_sim environments add a synthetic field/camera source so the gateway
; can be exercised on a bench without any other ESP present.

[platformio]
default_envs = gateway

[env]
monitor_speed = 115200
monitor_filters = time
build_flags =
    -std=gnu++17
    -Iinclude
lib_deps =
    bblanchon/ArduinoJson@^6.21.3
    symlink://../common

[env:gateway]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
upload_speed = 921600
build_unflags = -std=gnu++11
monitor_filters = esp32_exception_decoder, time

[env:gateway_sim]
extends = env:gateway
build_flags =
    ${env.build_flags}
    -DGW_SIMULATE=1

; Bring-up build: prints the sender MAC and RSSI of every telemetry frame.
[env:gateway_debug]
extends = env:gateway
build_flags =
    ${env.build_flags}
    -DGW_DEBUG_PEERS=1

[env:gateway_esp8266]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
build_unflags = -std=gnu++11

[env:gateway_esp8266_sim]
extends = env:gateway_esp8266
build_flags =
    ${env.build_flags}
    -DGW_SIMULATE=1

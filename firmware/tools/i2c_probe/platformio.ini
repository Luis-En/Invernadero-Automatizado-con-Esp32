; Standalone I2C probe for the field ESP32. Tries several SDA/SCL pin pairs
; and CSB/SDO strap combinations in one flash, so a mis-wired or unpowered
; BME280 can be located without re-flashing the field firmware each time.
;
; Build/upload: pio run -e probe -t upload --upload-port /dev/ttyUSB0
; Monitor:      pio device monitor

[env:probe]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = -std=gnu++17

; ESP32-CAM node: captures a JPEG on an interval and streams it to the field
; ESP32 over UART. The field node forwards the chunks to the gateway over
; ESP-NOW, so the camera needs no Wi-Fi and no separate gateway path.
;
; Build:   pio run -e camera             (AI-Thinker ESP32-CAM)
; Upload:  pio run -e camera -t upload   (use the micro-USB shield)
; Monitor: pio device monitor
;
; Notes:
;  * The camera UART TX must be wired to the field node RX (and optionally the
;    field TX to the camera RX for commands). See camera/include/config.h.
;  * VGA JPEG at quality 12 is ~30-40 KB, which keeps the transfer under a
;    minute on ESP-NOW without stalling the field node.

[platformio]
default_envs = camera

[env]
monitor_speed = 115200
monitor_filters = time
build_flags =
    -std=gnu++17
    -Iinclude
lib_deps =
    esp32-camera
    symlink://../common

[env:camera]
platform = espressif32@6.9.0
board = esp32cam
framework = arduino
upload_speed = 115200
build_unflags = -std=gnu++11
monitor_filters = esp32_exception_decoder, time
board_build.partitions = huge_app.csv

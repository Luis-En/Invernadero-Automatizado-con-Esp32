; ESP32 Field node: reads 6 capacitive soil sensors + BME280, drives 5
; actuators, runs the automation/fail-safe loop and talks to the gateway
; over ESP-NOW. Keeps the last valid config in NVS so it keeps controlling
; the greenhouse when the gateway or the Raspberry Pi go away.
;
; Build:   pio run -e field              (ESP32, real hardware)
;          pio run -e field_bench        (ESP32, bench: sensors faked)
; Upload:  pio run -e <env> -t upload
; Monitor: pio device monitor

[platformio]
default_envs = field

[env]
monitor_speed = 115200
monitor_filters = time
build_flags =
    -std=gnu++17
    -Iinclude
lib_deps =
    bblanchon/ArduinoJson@^6.21.3
    adafruit/Adafruit BME280 Library@^2.2.4
    adafruit/Adafruit Unified Sensor@^1.1.14
    symlink://../common

[env:field]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
upload_speed = 921600
build_unflags = -std=gnu++11
monitor_filters = esp32_exception_decoder, time

[env:field_bench]
extends = env:field
build_flags =
    ${env.build_flags}
    -DFIELD_BENCH=1

; Diagnostic build for validating the camera -> field UART link on hardware.
; It prints each received photo chunk to the USB serial port and does not
; forward over ESP-NOW, so only the ESP32 field node and the ESP32-CAM are
; needed. Monitor at 115200 and watch for "[photo]" lines.
[env:field_photo_test]
extends = env:field
build_flags =
    ${env.build_flags}
    -DFIELD_BENCH=1
    -DFIELD_PHOTO_TEST=1

; Bench bring-up for real hardware (single sensor, fast telemetry).
; Samples every 2 s and publishes every 5 s so the web dashboard updates
; almost live while sensors are being tested one by one. No BME280 is assumed
; until that sensor is wired, so its fields are reported as null.
[env:field_bringup]
extends = env:field
build_flags =
    ${env.build_flags}
    -DFIELD_NO_BME280=1
    -DFIELD_SAMPLE_INTERVAL_MS=2000UL
    -DFIELD_TELEMETRY_INTERVAL_MS=5000UL

; Diagnostic scan: reads all six ADC1 pins and reports the raw value regardless
; of FIELD_SOIL_MASK, so a bench probe can be located on the right pin. Watch
; the gateway_debug monitor for the soil_adc array.
[env:field_scan]
extends = env:field
build_flags =
    ${env.build_flags}
    -DFIELD_NO_BME280=1
    -DFIELD_SOIL_SCAN=1
    -DFIELD_SAMPLE_INTERVAL_MS=2000UL
    -DFIELD_TELEMETRY_INTERVAL_MS=5000UL

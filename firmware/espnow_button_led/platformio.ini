; ESP-NOW link test: press the button on one board and the LED toggles on the
; other, and vice versa. Builds for both ESP32 and ESP8266 so the two can be
; mixed.
;
;   pio run -e esp32 -t upload
;   pio run -e esp8266 -t upload
;   pio device monitor

[platformio]
default_envs = esp32

[env]
monitor_speed = 115200
monitor_filters = time
lib_deps =
    symlink://../common

[env:esp32]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino

[env:esp8266]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
; D3 = GPIO0 (boton a GND), D5 = GPIO14 (LED a GND, activo alto)
build_flags =
    -DPIN_BUTTON=0
    -DPIN_LED=14
    -DLED_ACTIVE_LOW=0

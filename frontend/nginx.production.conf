# Edge protection for the greenhouse UI and API.
# `limit_req_zone` lives in the http context (this file is included there).

limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/s;

# Preserve a TLS-terminating proxy's scheme; fall back to this connection.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}


# In production, redirect plain HTTP to HTTPS unless a trusted proxy already
# terminated TLS and forwarded X-Forwarded-Proto: https. /healthz is exempt
# so the container healthcheck keeps working.
map $uri $healthz_exempt {
    default 0;
    /healthz 1;
}

map "$forwarded_proto:$healthz_exempt" $redirect_https {
    default 1;
    "https:0" 0;
    "https:1" 0;
    "http:1" 0;
    "http:0" 1;
}

server {
    listen 80;

    if ($redirect_https = 1) {
        return 301 https://$host$request_uri;
    }
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Resolve the real client IP forwarded by the TLS tunnel/proxy.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 100.64.0.0/10;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;


    # Re-resolve the API container after docker compose recreates it.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;
    client_max_body_size 8m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;

    # Persisted for fail2ban (deploy/fail2ban).
    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log warn;

    # Login is the most sensitive endpoint: 10 requests/minute per IP at the
    # edge, on top of the application's per-IP and per-user lockout.
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_hide_header Server;
    }

    # Camera fragments arrive in bursts. The API already limits chunks per
    # device, so do not throttle this path at the edge.
    location = /api/photos/chunk {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_hide_header Server;
    }

    location /api/ {
        limit_req zone=api burst=120 nodelay;
        limit_req_status 429;

        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_hide_header Server;
    }

    location /health {
        proxy_pass $api_upstream/health;
        proxy_hide_header Server;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location = /sw.js {
        # The service worker must always be revalidated so updates ship.
        expires -1;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires 1h;
    }

    location = /asset-manifest.json {
        # Used by the service worker to precache every lazy chunk.
        # `expires -1` emits Cache-Control: no-cache and keeps the server-level
        # security headers because this block adds no headers of its own.
        expires -1;
    }

    location = /index.html {
        expires -1;
    }

    location /assets/ {
        # Vite fingerprints every file, so it is safe to cache forever.
        expires 1y;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hardening for the static shell.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws://$http_host wss://$http_host; font-src 'self' data:; manifest-src 'self'; worker-src 'self';" always;
}

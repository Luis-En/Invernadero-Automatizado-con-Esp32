<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1b4332" />
    <title>Sin conexión · Invernadero Automatizado</title>
    <style>
      :root {
        color-scheme: light;
        --green: #1b4332;
        --text: #1f2933;
        --muted: #5b6572;
      }
      * { box-sizing: border-box; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        padding: 1.5rem;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: var(--text);
        background: radial-gradient(circle at 15% 10%, #e5f3e6, #d8ecda);
      }
      main {
        width: 100%;
        max-width: 420px;
        padding: 2rem;
        border: 1px solid #dbe1d9;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
        text-align: center;
      }
      .mark {
        display: inline-grid;
        place-items: center;
        width: 64px;
        height: 64px;
        margin-bottom: 1rem;
        border-radius: 18px;
        background: #e8f5e9;
        font-size: 2rem;
      }
      h1 { margin: 0 0 0.5rem; font-size: 1.4rem; color: var(--green); }
      p { margin: 0.35rem 0; color: var(--muted); line-height: 1.55; }
      .retry {
        display: block;
        width: 100%;
        min-height: 44px;
        margin-top: 1.25rem;
        padding: 0.7rem 1rem;
        border-radius: 10px;
        background: #2d6a4f;
        color: #fff;
        font-weight: 600;
        line-height: 1.6;
        text-align: center;
        text-decoration: none;
      }
      .retry:hover,
      .retry:focus {
        background: #1b4332;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">🌱</div>
      <h1>Sin conexión</h1>
      <p>No se pudo contactar con el servidor del invernadero.</p>
      <p>Los datos en vivo necesitan la red local. Cuando vuelvas a estar conectado, la app se actualizará sola.</p>
      <a class="retry" href="/">Reintentar</a>
    </main>
  </body>
</html>

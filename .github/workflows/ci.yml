name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run pytest
        env:
          DEVICE_API_TOKEN: ci-device-token-0123456789
          JWT_SECRET_KEY: ci-secret-key-not-for-production
        run: pytest tests -q
      - name: Audit Python dependencies
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Compile field nodes
        working-directory: firmware/field
        run: pio run -e field -e field_secondary -e field_secondary_cal
      - name: Field logic tests
        run: bash firmware/field/tools/run_logic_tests.sh
      - name: Compile gateway
        working-directory: firmware/gateway
        run: pio run -e gateway
      - name: Validate serial payload contract
        run: bash firmware/gateway/scripts/check_payloads.sh
      - name: Compile camera node
        working-directory: firmware/camera
        run: pio run -e camera
